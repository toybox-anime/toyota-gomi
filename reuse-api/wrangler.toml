name = "gomi-reuse-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 公開値のみ。秘密（ADMIN_TOKEN / TURNSTILE_SECRET / IP_SALT）は
#   本番: npx wrangler secret put <NAME>
#   ローカル: .dev.vars（gitに入れない）
[vars]
ALLOWED_ORIGINS = "https://toybox-anime.github.io,http://localhost:8777,http://127.0.0.1:8777"
ALLOWED_CITIES = "toyota,chiryu"
POST_TTL_DAYS = "14"
REPORT_HIDE_THRESHOLD = "3"

[[d1_databases]]
binding = "DB"
database_name = "gomi-reuse"
database_id = "2e8eb906-0ca8-471f-a81e-f9fe3a947273"

# 写真はKV（カード登録不要）。60日で自動削除
[[kv_namespaces]]
binding = "IMAGES"
id = "3ea7d440a5294994a8dc5d68734a66a7"
