<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6a4c9c">
<title>知立市 ごみ収集日ガイド（デモ）</title>
<style>
  :root{ --bg:#f5f4f8; --card:#fff; --text:#1e1a2b; --sub:#6b6480; --line:#e7e4ee;
    --brand:#6a4c9c; --brand-d:#513a78; --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.04); }
  @media(prefers-color-scheme:dark){:root{--bg:#12111a;--card:#1c1a28;--text:#e9e6f2;--sub:#a29cb8;--line:#2c2940;--shadow:0 1px 3px rgba(0,0,0,.3);}}
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  .demo{background:#e8e2f4;color:#4a3a70;font-size:12px;text-align:center;padding:7px 12px;line-height:1.5}
  @media(prefers-color-scheme:dark){.demo{background:#241f38;color:#c9bfe6}}
  .topbar{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;padding:16px}
  .topbar .inner{max-width:600px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{font-size:26px}
  .brand h1{font-size:18px;margin:0;font-weight:700}
  .brand .city{font-size:12px;opacity:.9}
  .langs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .langs button{border:none;background:rgba(255,255,255,.16);color:#fff;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
  .langs button.on{background:#fff;color:var(--brand-d)}
  .wrap{max-width:600px;margin:0 auto;padding:16px 16px 48px}
  input#search{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);margin:4px 0 8px;box-shadow:var(--shadow)}
  select{width:100%;padding:14px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);margin:0 0 14px;box-shadow:var(--shadow)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .today{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;border:none}
  .today .lbl{font-size:12px;opacity:.85;font-weight:600;letter-spacing:.05em}
  .today .pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);padding:9px 13px;border-radius:999px;font-size:15px;font-weight:700;margin:8px 6px 0 0}
  .today .none{font-size:15px;opacity:.92;margin-top:8px}
  h2{font-size:13px;color:var(--sub);margin:2px 0 12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border:none}
  .cat{display:flex;align-items:center;gap:11px;font-weight:600;font-size:15px;flex:none}
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .when{color:var(--sub);font-size:12.5px;text-align:right;line-height:1.5}
  .next{font-size:12px;color:var(--brand);font-weight:700;margin-top:2px}
  footer{text-align:center;color:var(--sub);font-size:11px;margin-top:20px;line-height:1.8}
  a{color:var(--brand)}
</style>
</head>
<body>
<div class="demo" id="demoBar"></div>
<div class="topbar"><div class="inner">
  <div class="brand"><span class="logo">🗑️</span>
    <div><h1 id="appName"></h1><div class="city" id="cityName"></div></div></div>
  <div class="langs" id="langs"></div>
</div></div>
<div class="wrap">
  <input id="search" type="search" autocomplete="off">
  <select id="district"></select>
  <div class="card today" id="todayCard"></div>
  <div class="card"><h2 id="hSchedule"></h2><div id="schedule"></div></div>
  <footer id="footer"></footer>
</div>

<script src="data-chiryu.js"></script>
<script>
const CATS={ kanen:{color:"#e5533c",icon:"🔥"}, pura:{color:"#e6a417",icon:"♳"}, funen:{color:"#6b7280",icon:"🪨"}, shigen:{color:"#2f9e6e",icon:"♻️"} };
const I18N={
  ja:{label:"日本語",app:"ごみ収集日ガイド",ph:"🔍 地区・町名で検索",today:"今日",tomorrow:"明日",none:"今日の収集はありません",sched:"収集スケジュール",next:"次は",twice:"月2回",
      wd:["日","月","火","水","木","金","土"],cats:{kanen:"可燃ごみ",pura:"プラスチック資源",funen:"不燃物",shigen:"資源物"},
      demo:"知立市公式「ゴミチェッカー」のデータで作成したデモです（2026取得）。最新・正確な情報は知立市公式でご確認ください。"},
  en:{label:"English",app:"Garbage Collection Guide",ph:"🔍 Search your district",today:"Today",tomorrow:"Tomorrow",none:"No collection today",sched:"Collection schedule",next:"Next",twice:"Twice/month",
      wd:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],cats:{kanen:"Burnable",pura:"Plastics",funen:"Non-burnable",shigen:"Recyclables"},
      demo:"Demo built from Chiryu City's official “Gomi Checker” data (2026). Please confirm with the city's official site."},
  pt:{label:"Português",app:"Guia de Coleta de Lixo",ph:"🔍 Busque seu bairro",today:"Hoje",tomorrow:"Amanhã",none:"Sem coleta hoje",sched:"Programação",next:"Próximo",twice:"2x/mês",
      wd:["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"],cats:{kanen:"Queimável",pura:"Plásticos",funen:"Não queimável",shigen:"Recicláveis"},
      demo:"Demo com dados oficiais do “Gomi Checker” de Chiryu (2026). Confirme no site oficial da cidade."},
  easy:{label:"やさしい日本語",app:"ごみの ひ ガイド",ph:"🔍 ちく を さがす",today:"きょう",tomorrow:"あした",none:"きょうは ごみ を ださないで ください",sched:"ごみの ひ",next:"つぎは",twice:"つきに 2かい",
      wd:["にち","げつ","か","すい","もく","きん","ど"],cats:{kanen:"もえる ごみ",pura:"プラスチック",funen:"もえない ごみ",shigen:"しげん"},
      demo:"ちりゅうしの こうしき データで つくった デモです。ほんとうの ひは こうしきで かくにんして ください。"},
};
const $=s=>document.querySelector(s);
let LANG=localStorage.getItem("clang")||"ja";
const T=()=>I18N[LANG];
document.documentElement.style.setProperty("--brand","#6a4c9c");
$("#cityName").textContent="愛知県知立市";
const lb=$("#langs");
Object.keys(I18N).forEach(l=>{const b=document.createElement("button");b.textContent=I18N[l].label;b.dataset.l=l;
  b.onclick=()=>{LANG=l;localStorage.setItem("clang",l);apply();render();};lb.appendChild(b);});
const sel=$("#district"), search=$("#search");

function buildOptions(q){
  q=(q||"").trim(); sel.innerHTML=""; let first=null;
  CHIRYU.filter(d=>!q||d.name.includes(q)||(d.yomi&&d.yomi.includes(q))).forEach(d=>{
    const o=document.createElement("option");o.value=d.id;o.textContent=d.name;sel.appendChild(o);if(!first)first=d.id;});
  return first;
}
buildOptions(""); sel.value=CHIRYU[0].id; sel.onchange=render;
search.addEventListener("input",()=>{const f=buildOptions(search.value);if(f){sel.value=f;render();}});

const on=(c,d)=>c.weekly && c.days.includes(d.getDay());
function nextWeekly(c,from){const d=new Date(from);d.setHours(0,0,0,0);for(let i=0;i<8;i++){if(on(c,d))return{date:new Date(d),days:i};d.setDate(d.getDate()+1);}return null;}
function whenText(c){ // 多言語スケジュール文
  const t=T(); const ds=c.days.map(x=>t.wd[x]).join("・");
  if(LANG==="ja") return c.text;                       // 日本語は公式文言そのまま
  if(c.weekly) return t.weekly? "":(LANG==="en"?`Every ${ds}`:LANG==="pt"?`Toda ${ds}`:`まいしゅう ${ds}`);
  return "";
}
function whenLabel(c){
  const t=T(); const ds=c.days.map(x=>t.wd[x]).join("・");
  if(LANG==="ja") return c.text;
  if(c.weekly) return LANG==="en"?`Every ${ds}`:LANG==="pt"?`Toda ${ds}`:`まいしゅう ${ds}ようび`;
  // 月2回
  return (LANG==="en"?`${t.twice} (${ds})`:LANG==="pt"?`${t.twice} (${ds})`:`${t.twice}（${ds}）`);
}

function apply(){
  document.documentElement.lang=LANG==="pt"?"pt":(LANG==="en"?"en":"ja");
  $("#appName").textContent=T().app; $("#hSchedule").textContent=T().sched; $("#demoBar").textContent=T().demo; $("#search").placeholder=T().ph;
  [...lb.children].forEach(b=>b.classList.toggle("on",b.dataset.l===LANG));
}
function render(){
  const d=CHIRYU.find(x=>x.id===sel.value)||CHIRYU[0]; const t=T();
  const today=new Date();today.setHours(0,0,0,0);const tomo=new Date(today);tomo.setDate(tomo.getDate()+1);
  const ks=Object.keys(CATS);
  const td=ks.filter(k=>on(d.cats[k],today)), tm=ks.filter(k=>on(d.cats[k],tomo));
  let h=`<div class="lbl">${t.today.toUpperCase()} ${today.getMonth()+1}/${today.getDate()}（${t.wd[today.getDay()]}）</div>`;
  h+=td.length?td.map(k=>`<span class="pill">${CATS[k].icon} ${t.cats[k]}</span>`).join(""):`<div class="none">${t.none}</div>`;
  if(tm.length)h+=`<div style="margin-top:12px;opacity:.95;font-size:14px;border-top:1px solid rgba(255,255,255,.25);padding-top:10px">${t.tomorrow}：`+tm.map(k=>t.cats[k]).join("、")+`</div>`;
  $("#todayCard").innerHTML=h;
  $("#schedule").innerHTML=ks.map(k=>{const c=d.cats[k];const cc=CATS[k];
    const nx=c.weekly?nextWeekly(c,today):null;
    const nt=nx?(nx.days===0?t.today:nx.days===1?t.tomorrow:`${t.next} ${nx.date.getMonth()+1}/${nx.date.getDate()}（${t.wd[nx.date.getDay()]}）`):"";
    return `<div class="row"><div class="cat"><span class="dot" style="background:${cc.color}"></span>${cc.icon} ${t.cats[k]}</div>
      <div><div class="when">${whenLabel(c)}</div>${nt?`<div class="next">${nt}</div>`:""}</div></div>`;}).join("");
  $("#footer").innerHTML=`出典：知立市 ゴミチェッカー（公式）｜全${CHIRYU.length}地区<br><a href="../">▶ 豊田市版（全機能フルデモ）を見る</a>`;
}
apply(); render();
</script>
</body>
</html>
