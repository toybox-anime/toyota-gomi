<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f9e6e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ごみガイド">
<title>ごみ収集日ガイド</title>
<style>
  /* ===== 手本は冷蔵庫に貼る紙の「ごみカレンダー」：色で区分がひと目でわかる ===== */
  :root{
    --bg:#f2f4f3; --card:#ffffff; --soft:#f6f8f7; --text:#15201b; --sub:#5b6862; --line:#e0e5e2;
    --brand:#2f9e6e; --brand-d:#237a55; --on-brand:#fff;
    --r-lg:16px; --r-md:12px; --r-sm:9px;
    --shadow:0 1px 2px rgba(16,24,20,.05),0 6px 18px rgba(16,24,20,.05);
    --nav-h:64px; --sun:#c2410c; --sat:#1d4ed8;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1311; --card:#171d1a; --soft:#1d2521; --text:#e7ece9; --sub:#9aa6a0; --line:#28322d;
      --shadow:0 1px 2px rgba(0,0,0,.45); --sun:#fb923c; --sat:#93b4ff; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  a{color:var(--brand)}
  .num{font-variant-numeric:tabular-nums}
  svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* ===== ヘッダ（市のブランド色・細く） ===== */
  .topbar{background:var(--brand);color:var(--on-brand);padding:calc(env(safe-area-inset-top) + 10px) 16px 12px}
  .topbar .inner{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:11px}
  .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:20px;flex:none}
  .brand-t{flex:1;min-width:0}
  .brand-t h1{font-size:16px;line-height:1.3;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-t .city{font-size:12px;opacity:.85}
  .lang{position:relative;flex:none}
  .lang select{appearance:none;-webkit-appearance:none;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);
    color:var(--on-brand);font-size:13px;font-weight:700;padding:7px 28px 7px 12px;border-radius:999px;max-width:150px}
  .lang select option{color:#15201b;background:#fff}
  .lang::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:2px solid currentColor;
    border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none;color:var(--on-brand)}

  .wrap{max-width:600px;margin:0 auto;padding:14px 16px 8px}

  /* ===== 地区（普段は1行にたたむ） ===== */
  .district{width:100%;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r-md);padding:11px 14px;text-align:left;box-shadow:var(--shadow);margin-bottom:12px}
  .district .i{color:var(--brand)}
  .district .dt{flex:1;min-width:0;line-height:1.35}
  .district .dn{display:block;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .district .da{display:block;font-size:12px;color:var(--sub)}
  .district .chg{font-size:13px;font-weight:700;color:var(--brand);flex:none}
  .dpanel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;margin:-4px 0 12px;box-shadow:var(--shadow)}
  .dpanel .hint{font-size:13.5px;font-weight:700;margin:0 0 8px}
  .dpanel input,.dpanel select{display:block;width:100%;padding:12px;font-size:16px;border:1px solid var(--line);
    border-radius:var(--r-sm);background:var(--soft);margin:0 0 8px}
  #count{font-size:12px;color:var(--sub);text-align:right}

  /* ===== 今日・明日（主役） ===== */
  .hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  .day{padding:14px 16px}
  .day + .day{border-top:1px solid var(--line)}
  .dlabel{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
  .dlabel b{font-size:15px;font-weight:800}
  .dlabel span{font-size:13px;color:var(--sub)}
  .tiles{display:flex;flex-wrap:wrap;gap:8px}
  .tile{display:flex;align-items:center;gap:10px;flex:1 1 auto;background:var(--c);color:var(--on,#fff);
    border-radius:var(--r-md);padding:13px 16px;font-size:19px;font-weight:800;line-height:1.25}
  .tile .ic{font-size:24px;line-height:1}
  .tile.sm{flex:0 1 auto;padding:8px 12px;font-size:14.5px;border-radius:var(--r-sm)}
  .tile.sm .ic{font-size:17px}
  .none{font-size:15px;color:var(--sub);font-weight:700}

  /* ===== 1週間の帯 ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
  h2{font-size:12.5px;color:var(--sub);margin:0 0 10px;font-weight:700;letter-spacing:.06em}
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .wd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 10px;border-radius:var(--r-sm);min-height:96px}
  .wd.is-today{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--brand)}
  .wd .w{font-size:11.5px;font-weight:700;color:var(--sub);white-space:nowrap}
  .wd.sun .w{color:var(--sun)} .wd.sat .w{color:var(--sat)}
  .wd .d{font-size:17px;font-weight:800;line-height:1.1}
  .wd .m{width:28px;height:28px;border-radius:8px;background:var(--c);display:grid;place-items:center;font-size:15px;line-height:1}

  /* ===== 収集スケジュール ===== */
  .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .row:last-of-type{border-bottom:none}
  .ctile{width:36px;height:36px;border-radius:10px;background:var(--c);display:grid;place-items:center;font-size:18px;line-height:1;flex:none}
  .cat{flex:1;min-width:0}
  .cat .cn{font-weight:700;font-size:15px;line-height:1.35}
  .cat .when{font-size:12.5px;color:var(--sub)}
  .next{font-size:13px;font-weight:800;text-align:right;white-space:nowrap}
  .next.soon{color:var(--brand)}

  /* ===== ボタン ===== */
  .calbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:13px 16px;border:none;
    border-radius:var(--r-md);background:var(--brand);color:var(--on-brand);font-size:15px;font-weight:700;transition:transform .1s}
  .calbtn:active{transform:scale(.98)}
  .calbtn.done{background:var(--soft);color:var(--sub);box-shadow:inset 0 0 0 1px var(--line)}
  .rghost{border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;font-weight:700;padding:11px 14px;border-radius:var(--r-md)}
  .rghost:disabled{opacity:.55}

  /* ===== チップ（色は --c で指定。どの色でも読める淡色表示） ===== */
  .chip{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;
    background:color-mix(in srgb,var(--c,var(--brand)) 16%,var(--card));color:var(--text);
    border:1px solid color-mix(in srgb,var(--c,var(--brand)) 40%,var(--card))}

  .rule{font-size:14px;line-height:1.8}.rule b{font-weight:800}
  .note{font-size:12px;color:var(--sub);line-height:1.7;margin-top:8px}
  footer{text-align:center;color:var(--sub);font-size:11.5px;margin:18px 0 4px;line-height:1.8}

  /* ===== 分別ガイド・辞典・写真 ===== */
  .keyrule{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--brand) 10%,var(--card));
    border:1px solid color-mix(in srgb,var(--brand) 30%,var(--card));border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.7}
  .keyrule .i2{font-size:19px;line-height:1.35;flex:none}
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .gcard .top{display:flex;align-items:center;gap:11px;margin-bottom:9px}
  .gcard .nm{font-weight:800;font-size:16.5px;line-height:1.35}
  .gcard .desc{font-size:13.5px;color:var(--sub);margin:10px 0 12px;line-height:1.7}
  .gcard .lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--sub);margin:0 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .chips span{font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:4px 9px}
  .grules{list-style:none;padding:0;margin:0}
  .grules li{font-size:13.5px;padding:3px 0 3px 22px;position:relative;line-height:1.6}
  .grules li::before{content:"";position:absolute;left:3px;top:.62em;width:9px;height:5px;border-left:2px solid var(--brand);border-bottom:2px solid var(--brand);transform:rotate(-45deg)}
  .placenote{font-size:12px;color:var(--sub);margin-top:9px}
  #dictSearch{display:block;width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--soft)}
  .drow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .drow:last-child{border:none}
  .dname{font-weight:700;font-size:14.5px}
  .dnote{font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.5}

  /* ===== ゆずります ===== */
  .rh{font-size:17px;font-weight:800;line-height:1.45}
  .rlead{font-size:13.5px;color:var(--sub);margin:6px 0 10px;line-height:1.7}
  .rrules{font-size:13px;margin-bottom:10px;border-top:1px solid var(--line)}
  .rrules summary{padding:10px 0 4px;font-size:13.5px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center}
  .rrules summary::-webkit-details-marker{display:none}
  .rrules summary::after{content:"＋";margin-left:auto;color:var(--sub)}
  .rrules[open] summary::after{content:"−"}
  .rrules ul{margin:6px 0 0;padding-left:20px;line-height:1.8}
  .rnote{font-size:13px;background:var(--soft);border:1px dashed var(--line);border-radius:var(--r-sm);padding:10px 12px;color:var(--sub)}
  .rbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .rbtns .calbtn{flex:1;width:auto;margin-top:0}
  .rback{margin-bottom:12px}
  .rfilters{display:flex;gap:8px;margin-bottom:12px}
  .rfilters select{flex:1;min-width:0;font-size:14px;padding:11px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
  .rlist .rcard{padding:0;overflow:hidden}
  .rlist .rcard > :not(.rimg){margin-left:16px;margin-right:16px}
  .rlist .rcard .rtop{margin-top:14px}
  .rlist .rcard .rbtns{margin-bottom:16px}
  .rimg{width:100%;max-height:260px;object-fit:cover;display:block;background:var(--soft)}
  .rform .rimg{border-radius:var(--r-md);margin-bottom:10px}
  .rtop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .rleft{font-size:12px;color:var(--sub)}
  .rtitle{font-size:16.5px;font-weight:800;margin:6px 0 4px;line-height:1.4}
  .rtext{font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .rmeta{font-size:12.5px;color:var(--sub);margin-top:8px;line-height:1.7}
  .rform label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:12px}
  .rform input:not([type=checkbox]),.rform select,.rform textarea{display:block;width:100%;margin:5px 0 0;padding:11px 12px;font-size:16px;
    border:1px solid var(--line);border-radius:var(--r-sm);background:var(--soft);color:var(--text)}
  .rform .rcheck{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px}
  .rts{min-height:66px;margin:4px 0 8px}
  .rsec{margin:18px 2px 10px}
  .rstat{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--sub);white-space:nowrap}
  .rstat.s-approved{background:var(--brand);color:var(--on-brand)}
  .rstat.s-pending{background:#fff3cd;color:#7a5a00}
  .rthread{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
  .rmsg{font-size:13.5px;line-height:1.6;padding:8px 11px;border-radius:var(--r-sm);background:var(--soft);margin:6px 0;word-break:break-word}
  .rmsg.mine{background:color-mix(in srgb,var(--brand) 14%,var(--card))}
  .rmsg b{font-size:11.5px;color:var(--sub);margin-right:6px}
  .rreply{display:flex;gap:6px;margin-top:8px}
  .rreply input{flex:1;min-width:0;padding:10px 12px;font-size:15px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--soft)}

  /* ===== 下のメニュー（親指で押せる位置） ===== */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;
    background:color-mix(in srgb,var(--card) 94%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);
    border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .tabs button{flex:1;max-width:190px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border:none;background:none;color:var(--sub);font-size:11.5px;font-weight:700;border-radius:12px;padding:4px 2px;line-height:1.2}
  .tabs button .ib{display:grid;place-items:center;width:52px;height:28px;border-radius:999px;transition:background .15s}
  .tabs button.on{color:var(--brand)}
  .tabs button.on .ib{background:color-mix(in srgb,var(--brand) 15%,var(--card))}
  .tabs button .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
  <header class="topbar"><div class="inner">
    <span class="logo" id="logo" aria-hidden="true">🗑️</span>
    <div class="brand-t">
      <h1 id="appName">ごみ収集日ガイド</h1>
      <div class="city" id="cityName"></div>
    </div>
    <label class="lang"><span hidden>Language</span><select id="langSel" aria-label="Language"></select></label>
  </div></header>

  <main class="wrap">
    <div id="viewSchedule">
      <button class="district" id="dbtn" aria-expanded="false" aria-controls="dpanel">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
        <span class="dt"><span class="dn" id="dName"></span><span class="da" id="dArea"></span></span>
        <span class="chg" id="dChg"></span>
      </button>
      <div class="dpanel" id="dpanel" hidden>
        <p class="hint" id="dHint" hidden></p>
        <input id="search" type="search" autocomplete="off">
        <select id="district"></select>
        <div id="count"></div>
      </div>

      <section class="hero" id="todayCard" aria-live="polite"></section>
      <section class="card"><h2 id="hWeek"></h2><div class="week" id="week"></div></section>
      <section class="card"><h2 id="hSchedule"></h2><div id="schedule"></div>
        <button id="calBtn" class="calbtn"></button></section>
      <section class="card"><h2 id="hRules"></h2><div class="rule" id="rules"></div></section>
      <footer id="footer"></footer>
    </div>

    <div id="viewGuide" hidden>
      <section class="card" id="photoCard">
        <h2 id="hPhoto"></h2>
        <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
        <button class="calbtn" id="photoBtn" style="margin-top:0"></button>
        <div id="photoStatus" class="placenote"></div>
        <div id="photoResult"></div>
        <div class="placenote" id="photoDisclaim"></div>
      </section>
      <div class="keyrule" id="keyRule"></div>
      <div id="guideCards"></div>
      <section class="card">
        <h2 id="hDict"></h2>
        <input id="dictSearch" type="search" autocomplete="off">
        <div id="dictResults"></div>
        <a id="dictLink" href="#" target="_blank" rel="noopener" style="font-size:12.5px;display:inline-block;margin-top:10px"></a>
      </section>
    </div>

    <div id="viewReuse" hidden><div id="reuseRoot"></div></div>
  </main>

  <nav class="tabs" id="tabs">
    <button data-v="schedule" class="on" id="tabS"><span class="ib"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span><span class="tl"></span></button>
    <button data-v="guide" id="tabG"><span class="ib"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z"/><path d="M5 20.5A2.5 2.5 0 0 1 7.5 18H19v3H7.5M9 7.5h6"/></svg></span><span class="tl"></span></button>
    <button data-v="reuse" id="tabR"><span class="ib"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11a7.5 7.5 0 0 1 12.8-5.3L19.5 8M19.5 3.5V8H15M19.5 13a7.5 7.5 0 0 1-12.8 5.3L4.5 16M4.5 20.5V16H9"/></svg></span><span class="tl"></span></button>
  </nav>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="dict.js"></script>
<script src="guide.js"></script>
<script src="photo.js"></script>
<script>
const $ = s => document.querySelector(s);
let LANG = localStorage.getItem("lang") || CONFIG.defaultLang;
if (!I18N[LANG]) LANG = CONFIG.defaultLang;
const T = () => I18N[LANG];
const fmt = (s, ...a) => { let i=0; return s.replace(/%[ds]/g, ()=>a[i++]); };

// 背景色に対して読みやすい文字色（白 or 濃色）を選ぶ
function textOn(hex){
  const n=parseInt(hex.replace("#",""),16), ch=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});
  const L=.2126*ch[0]+.7152*ch[1]+.0722*ch[2];
  return 1.05/(L+.05) >= 3 ? "#ffffff" : "#1a1d1b";
}

// ===== 匿名の利用集計（効果ダッシュボード用）=====
// 送るのは「種類とキー」だけ。Do Not Track / GPC が有効なら送らない。
// ローカル検証は ?reuseApi= を付けたときだけ送る（本番の数字を汚さない）。
const EV_LOCAL = ["localhost","127.0.0.1"].includes(location.hostname);
const EV_API = ((EV_LOCAL ? new URLSearchParams(location.search).get("reuseApi") : CONFIG.reuseApi) || "").replace(/\/$/, "");
const EV_OFF = !EV_API || !CONFIG.cityId || navigator.doNotTrack === "1" || navigator.globalPrivacyControl === true;
let evQ = [], evTimer = null;
function track(kind, key){
  if (EV_OFF || key == null || key === "") return;
  evQ.push([kind, String(key).slice(0, 40)]);
  clearTimeout(evTimer); evTimer = setTimeout(flushEv, 2000);
}
function flushEv(){
  clearTimeout(evTimer);
  if (!evQ.length) return;
  const body = JSON.stringify({ city: CONFIG.cityId, ev: evQ.splice(0, 10) });
  fetch(EV_API + "/api/ev", { method:"POST", headers:{ "Content-Type":"text/plain" }, body, keepalive:true }).catch(()=>{});
  if (evQ.length) flushEv();
}
addEventListener("pagehide", flushEv);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushEv(); });

// ブランド適用
document.documentElement.style.setProperty("--brand", CONFIG.brandColor);
document.documentElement.style.setProperty("--brand-d", CONFIG.brandColorDark);
document.documentElement.style.setProperty("--on-brand", textOn(CONFIG.brandColor));
document.querySelector('meta[name="theme-color"]').content = CONFIG.brandColor;
$("#logo").textContent = CONFIG.logo;
$("#cityName").textContent = CONFIG.cityName;

// 言語切替（右上）
const langSel = $("#langSel");
CONFIG.languages.forEach(l=>{ const o=document.createElement("option"); o.value=l; o.textContent=I18N[l].label; langSel.appendChild(o); });
langSel.onchange = () => { LANG=langSel.value; localStorage.setItem("lang",LANG); applyLang(); render(); };

const WD = () => T().wd;
const nthWeek = d => Math.floor((d.getDate()-1)/7)+1;
function collectsOn(s,d){ if(!s)return false; const w=d.getDay();
  if(s.weekly) return s.weekly.includes(w);
  if(s.monthly) return s.monthly.day===w && s.monthly.week===nthWeek(d);
  return false; }
function nextDate(s,from){ const d=new Date(from); d.setHours(0,0,0,0);
  for(let i=0;i<62;i++){ if(collectsOn(s,d)) return {date:new Date(d),days:i}; d.setDate(d.getDate()+1);} return null; }
function fmtWhen(s){
  if(s.weekly) return T().weekly.replace("{d}", s.weekly.map(w=>WD()[w]).join("・"));
  if(s.monthly) return T().monthly.replace("{w}", s.monthly.week).replace("{d}", WD()[s.monthly.day]);
  return ""; }
const md = dt => `${dt.getMonth()+1}/${dt.getDate()}（${WD()[dt.getDay()]}）`;

// ===== 地区（ふだんは1行、押すと検索パネル） =====
const sel = $("#district"), search = $("#search"), dpanel = $("#dpanel"), dbtn = $("#dbtn");
const firstRun = !localStorage.getItem("district");
function setPanel(open){
  dpanel.hidden = !open; dbtn.setAttribute("aria-expanded", String(open));
  if(open) setTimeout(()=>search.focus(), 50);
}
dbtn.onclick = () => setPanel(dpanel.hidden);

function buildOptions(q){
  q=(q||"").trim(); sel.innerHTML="";
  const areas=[...new Set(DISTRICTS.map(d=>d.area))];
  let shown=0, first=null;
  areas.forEach(area=>{
    const list=DISTRICTS.filter(d=>d.area===area && (!q||d.name.includes(q)||area.includes(q)));
    if(!list.length) return;
    const g=document.createElement("optgroup"); g.label=area;
    list.forEach(d=>{ const o=document.createElement("option"); o.value=d.id; o.textContent=d.name;
      g.appendChild(o); shown++; if(!first)first=d.id; });
    sel.appendChild(g);
  });
  $("#count").textContent = q ? fmt(T().hit, shown) : fmt(T().all, DISTRICTS.length);
  return first;
}

function applyLang(){
  document.documentElement.lang = LANG==="pt"?"pt":(LANG==="en"?"en":"ja");
  langSel.value = LANG;
  $("#appName").textContent = T().appName;
  $("#search").placeholder = T().search;
  $("#dChg").textContent = T().change;
  $("#dHint").textContent = T().pickFirst;
  $("#hWeek").textContent = T().week;
  $("#hSchedule").textContent = T().schedule;
  $("#hRules").textContent = T().rules;
  $("#tabS .tl").textContent = T().tabS;
  $("#tabG .tl").textContent = T().tabG;
  $("#tabR .tl").textContent = T().tabR;
  if (typeof renderReuse === "function") renderReuse();
  $("#hPhoto").textContent = T().phTitle;
  $("#photoBtn").textContent = T().phBtn;
  $("#photoDisclaim").textContent = T().phDisclaim;
  $("#hDict").textContent = T().dictQ;
  $("#dictSearch").placeholder = T().dictPh;
  const dl=$("#dictLink"); dl.textContent = T().dictOfficial + " ↗"; dl.href = CONFIG.dictUrl;
  renderDict($("#dictSearch").value);
  renderGuide();
  buildOptions(search.value);
  const saved=localStorage.getItem("district");
  if(saved && DISTRICTS.some(d=>d.id===saved)) sel.value=saved;
}

function tileHTML(k, small){
  const c=CATEGORIES[k];
  return `<div class="tile${small?" sm":""}" style="--c:${c.color};--on:${textOn(c.color)}"><span class="ic" aria-hidden="true">${c.icon}</span><span>${T().cats[k]}</span></div>`;
}

function render(){
  const d = DISTRICTS.find(x=>x.id===sel.value) || DISTRICTS[0];
  if(!d) return;
  localStorage.setItem("district", d.id);
  $("#dName").textContent = d.name;
  $("#dArea").textContent = d.area;
  const today=new Date(); today.setHours(0,0,0,0);
  const tomo=new Date(today); tomo.setDate(tomo.getDate()+1);
  const cats=Object.keys(CATEGORIES);
  const cn = k => T().cats[k];

  // 今日・明日：収集がある最初の日を大きく
  const todays=cats.filter(k=>collectsOn(d.schedule[k],today));
  const tomos =cats.filter(k=>collectsOn(d.schedule[k],tomo));
  const dayBlock=(label, dt, list, big, noneText)=>`<div class="day">
      <div class="dlabel"><b>${label}</b><span class="num">${md(dt)}</span></div>
      ${list.length ? `<div class="tiles">${list.map(k=>tileHTML(k,!big)).join("")}</div>` : `<div class="none">${noneText}</div>`}
    </div>`;
  $("#todayCard").innerHTML =
    dayBlock(T().today, today, todays, true, T().noneShort) +
    dayBlock(T().tomorrow, tomo, tomos, !todays.length, T().noneShort);

  // 1週間の帯
  let w="";
  for(let i=0;i<7;i++){
    const dt=new Date(today); dt.setDate(dt.getDate()+i);
    const ks=cats.filter(k=>collectsOn(d.schedule[k],dt)), dow=dt.getDay();
    w+=`<div class="wd${i===0?" is-today":""}${dow===0?" sun":dow===6?" sat":""}" title="${ks.map(cn).join("・")}">
      <span class="w">${WD()[dow]}</span><span class="d num">${dt.getDate()}</span>
      ${ks.map(k=>`<span class="m" style="--c:${CATEGORIES[k].color}" role="img" aria-label="${cn(k)}">${CATEGORIES[k].icon}</span>`).join("")}
    </div>`;
  }
  $("#week").innerHTML=w;

  // 区分ごとの一覧
  $("#schedule").innerHTML = cats.map(k=>{
    const s=d.schedule[k]; if(!s) return ""; const c=CATEGORIES[k];
    const nx=nextDate(s,today);
    const nxt = nx ? (nx.days===0?T().today:nx.days===1?T().tomorrow:`${T().next} ${md(nx.date)}`) : "";
    return `<div class="row">
      <span class="ctile" style="--c:${c.color}" aria-hidden="true">${c.icon}</span>
      <div class="cat"><div class="cn">${cn(k)}</div><div class="when">${fmtWhen(s)}</div></div>
      <div class="next num${nx&&nx.days<=1?" soon":""}">${nxt}</div></div>`;
  }).join("");

  $("#rules").innerHTML =
    `<b>${T().ruleTime}：</b>${T().timeTxt}<br><b>${T().rulePlace}：</b>${T().placeTxt}`;

  $("#footer").innerHTML =
    `${CONFIG.cityShort}公式データ（${CONFIG.dataUpdated}・全${DISTRICTS.length}自治区）`+
    `<br><a href="${CONFIG.officialUrl}" target="_blank" rel="noopener">${CONFIG.cityShort} 公式ごみ情報 ↗</a>`+
    (EV_OFF ? "" : `<br><span style="font-size:11px">${T().privacy}</span>`);

  // カレンダー通知ボタン
  const btn = $("#calBtn");
  btn.className = "calbtn";
  btn.textContent = T().cal;
  btn.onclick = () => { downloadICS(d); track("ics", d.area); btn.className = "calbtn done"; btn.textContent = "✓ " + T().calDone; };
}

// ===== カレンダー(.ics)生成：繰り返し予定＋前日20時アラーム =====
const BYDAY = ["SU","MO","TU","WE","TH","FR","SA"];
const pad = n => String(n).padStart(2, "0");
const dstamp = dt => `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}`;
function nextOf(s, from){ const d=new Date(from); d.setHours(0,0,0,0);
  for(let i=0;i<62;i++){ if(collectsOn(s,d)) return new Date(d); d.setDate(d.getDate()+1);} return null; }

function buildICS(d){
  const today = new Date(); today.setHours(0,0,0,0);
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//gomi-guide//JP","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  Object.keys(CATEGORIES).forEach(k=>{
    const s = d.schedule[k]; if(!s) return;
    const start = nextOf(s, today); if(!start) return;
    let rrule;
    if(s.weekly) rrule = `FREQ=WEEKLY;BYDAY=${s.weekly.map(w=>BYDAY[w]).join(",")}`;
    else rrule = `FREQ=MONTHLY;BYDAY=${s.monthly.week}${BYDAY[s.monthly.day]}`;
    const dt = `${dstamp(start)}T070000`;          // 収集日 07:00（フローティング＝端末ローカル時刻）
    const name = CATEGORIES[k].icon + I18N[LANG].cats[k];
    L.push(
      "BEGIN:VEVENT",
      `UID:gomi-${d.id}-${k}@${location.host}`,
      `SUMMARY:${name}`,
      `DTSTART:${dt}`,
      `DTEND:${dstamp(start)}T073000`,
      `RRULE:${rrule}`,
      `DESCRIPTION:${I18N[LANG].timeTxt}（${d.area} ${d.name}）`,
      "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${name}`,"TRIGGER:-PT11H",  // 07:00-11h=前日20:00
      "END:VALARM","END:VEVENT"
    );
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function downloadICS(d){
  const blob = new Blob([buildICS(d)], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `gomi-${d.name}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

// ===== 分別辞典 検索 =====
function dictCatInfo(cat){
  if(CATEGORIES[cat]) return { icon:CATEGORIES[cat].icon, color:CATEGORIES[cat].color, label:T().cats[cat] };
  const e=DICT_EXTRA[cat]; const lk=(LANG==="en"||LANG==="pt")?LANG:"ja";
  return { icon:e.icon, color:e.color, label:e[lk] };
}
// カタカナ→ひらがな・小文字化・記号除去で表記ゆれに強くする
function fold(s){
  return (s||"").toLowerCase().replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60))
    .replace(/[\s・･、,\.]/g,"");
}
function renderDict(q){
  const box=$("#dictResults"); q=(q||"").trim();
  if(!q){ box.innerHTML=""; return null; }
  const fq=fold(q);
  const lk=(LANG==="en"||LANG==="pt")?LANG:"ja";
  const hits=DICT.filter(it=>{
    const fields=[it.ja,it.yomi,it.en,it.pt, ...(typeof SYNONYMS!=="undefined"&&SYNONYMS[it.ja]||[])];
    return fields.some(f=>f && fold(f).includes(fq));
  }).slice(0,25);
  if(!hits.length){ box.innerHTML=`<div class="dnote" style="padding:10px 0">${T().dictNone}</div>`; return false; }
  box.innerHTML = hits.map(it=>{
    const c=dictCatInfo(it.cat);
    const name = it[LANG] || it.ja;
    const note = it.note ? (it.note[lk]||it.note.ja)
      : (DICT_EXTRA[it.cat] ? (DICT_EXTRA[it.cat].note[lk]||DICT_EXTRA[it.cat].note.ja) : "");
    return `<div class="drow">
      <div><div class="dname">${name}</div>${note?`<div class="dnote">${note}</div>`:""}</div>
      <span class="chip" style="--c:${c.color}">${c.icon} ${c.label}</span>
    </div>`;
  }).join("");
  return hits[0];
}
// 入力が止まってから1回だけ数える（1文字ずつ数えない）
let dictTimer=null, dictLast="";
$("#dictSearch").addEventListener("input", e=>{
  const q=e.target.value, r=renderDict(q);
  clearTimeout(dictTimer);
  dictTimer=setTimeout(()=>{
    const fq=fold(q.trim()); if(fq.length<2 || fq===dictLast) return; dictLast=fq;
    if(r) track("dict_hit", r.ja); else if(r===false) track("dict_miss", fq.slice(0,24));
  }, 1500);
});

// ===== 分別ガイド（出す場所の軸で見える化）=====
function renderGuide(){
  const lk=["en","pt","easy"].includes(LANG)?LANG:"ja";
  $("#keyRule").innerHTML=`<span class="i2" aria-hidden="true">💡</span><div>${KEY_RULE[lk]||KEY_RULE.ja}</div>`;
  $("#guideCards").innerHTML=GUIDE.map(g=>{
    const isCat=!!CATEGORIES[g.cat];
    const name=isCat?T().cats[g.cat]:(g.name[lk]||g.name.ja);
    const color=isCat?CATEGORIES[g.cat].color:g.color;
    const icon=isCat?CATEGORIES[g.cat].icon:g.icon;
    const pl=PLACES[g.place];
    const desc=(g.desc&&(g.desc[lk]||g.desc.ja))||"";
    const itemsArr=(g.items&&(g.items[lk]||g.items.ja))||[];
    const rulesArr=(g.rules&&(g.rules[lk]||g.rules.ja))||[];
    return `<div class="gcard">
      <div class="top"><span class="ctile" style="--c:${color}" aria-hidden="true">${icon}</span><span class="nm">${name}</span></div>
      <span class="chip" style="--c:${pl.color}">${pl.icon} ${pl.label[lk]||pl.label.ja}</span>
      <div class="desc">${desc}</div>
      <div class="lbl">${T().gItems}</div><div class="chips">${itemsArr.map(x=>`<span>${x}</span>`).join("")}</div>
      <div class="lbl">${T().gRules}</div><ul class="grules">${rulesArr.map(r=>`<li>${r}</li>`).join("")}</ul>
      <div class="placenote">${pl.note[lk]||pl.note.ja}</div>
    </div>`;
  }).join("");
}

// ===== 下のメニュー（タブ）=====
const tabbar=$("#tabs");
tabbar.querySelectorAll("button").forEach(b=>b.onclick=(e)=>{
  if(e && e.isTrusted) track("tab", b.dataset.v);
  tabbar.querySelectorAll("button").forEach(x=>{ x.classList.toggle("on",x===b); x.setAttribute("aria-current", x===b?"page":"false"); });
  const v=b.dataset.v;
  $("#viewSchedule").hidden=(v!=="schedule");
  $("#viewGuide").hidden=(v!=="guide");
  $("#viewReuse").hidden=(v!=="reuse");
  if (v==="reuse" && typeof renderReuse === "function") renderReuse();
  localStorage.setItem("tab",v);
  window.scrollTo(0,0);
});
(function restoreTab(){
  const v=localStorage.getItem("tab")||"schedule";
  const b=tabbar.querySelector(`button[data-v="${v}"]`); if(b) b.click();
})();

// ===== 写真判定（オンデバイスAI: TensorFlow.js + MobileNet。API不要）=====
let _mnModel=null, _mnLoading=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load "+src));document.head.appendChild(s);});}
async function ensureModel(){
  if(_mnModel) return _mnModel;
  if(!_mnLoading){ _mnLoading=(async()=>{
    $("#photoStatus").textContent=T().phLoading;
    if(!window.tf) await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js");
    if(!window.mobilenet) await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js");
    _mnModel=await mobilenet.load({version:2,alpha:1.0});
    return _mnModel;
  })(); }
  return _mnLoading;
}
function lkey(){ return ["en","pt","easy"].includes(LANG)?LANG:"ja"; }
function resolvePhoto(label){
  const lk=lkey();
  for(const m of PHOTO_MAP){
    if(m.kw.some(k=>label.includes(k))){
      if(m.item){ const it=DICT.find(d=>d.ja===m.item); if(it){ const info=dictCatInfo(it.cat);
        const note=it.note?(it.note[lk]||it.note.ja):(DICT_EXTRA[it.cat]?(DICT_EXTRA[it.cat].note[lk]||DICT_EXTRA[it.cat].note.ja):"");
        return {info, name:(it[LANG]||it.ja), note, key:it.ja}; } }
      if(m.cat){ const info=dictCatInfo(m.cat); return {info, name:(m.label?(m.label[lk]||m.label.ja):info.label), note:"", key:(m.label?m.label.ja:m.cat)}; }
    }
  }
  return null;
}
$("#photoBtn").onclick=()=>$("#photoInput").click();
$("#photoInput").addEventListener("change", async e=>{
  const file=e.target.files[0]; if(!file) return;
  const url=URL.createObjectURL(file);
  $("#photoResult").innerHTML=`<img src="${url}" alt="" style="max-width:100%;max-height:220px;border-radius:12px;margin-top:12px;display:block">`;
  try{
    const model=await ensureModel();
    $("#photoStatus").textContent=T().phAnalyzing;
    const img=new Image(); img.src=url; await img.decode();
    const preds=await model.classify(img,5);
    $("#photoStatus").textContent="";
    let hit=null, used=null;
    for(const p of preds){ const r=resolvePhoto(p.className.toLowerCase()); if(r){ hit=r; used=p; break; } }
    track("photo", hit?"hit":"miss"); if(hit) track("photo_item", hit.key);
    const alt=preds.slice(0,3).map(p=>`${p.className.split(",")[0]} ${Math.round(p.probability*100)}%`).join(" ・ ");
    if(hit){
      $("#photoResult").insertAdjacentHTML("beforeend",`
       <div class="drow" style="margin-top:12px">
        <div><div class="dname">${hit.name}</div>${hit.note?`<div class="dnote">${hit.note}</div>`:""}
          <div class="dnote">${T().phConf} ${Math.round(used.probability*100)}%</div></div>
        <span class="chip" style="--c:${hit.info.color}">${hit.info.icon} ${hit.info.label}</span></div>
       <div class="placenote">AI: ${alt}</div>`);
    } else {
      $("#photoResult").insertAdjacentHTML("beforeend",
        `<div class="dnote" style="margin-top:12px">${T().phNoMatch}</div><div class="placenote">AI: ${alt}</div>`);
    }
  }catch(err){
    $("#photoStatus").textContent="";
    $("#photoResult").insertAdjacentHTML("beforeend",`<div class="dnote" style="margin-top:12px">${T().phNoMatch}</div>`);
  } finally { setTimeout(()=>URL.revokeObjectURL(url),4000); }
});

search.addEventListener("input", ()=>{ const f=buildOptions(search.value); if(f){sel.value=f; render();} });
sel.addEventListener("change", ()=>{ render(); $("#dHint").hidden=true; setPanel(false); });

applyLang();
if(!sel.value && DISTRICTS[0]) sel.value=DISTRICTS[0].id;
render();
// 初回は地区選びから
if(firstRun){ $("#dHint").hidden=false; setPanel(true); }

// 利用者数の目安：1端末1日1回だけ「開いた」を数える（地区は選んだ人だけ）
(function countOpen(){
  const today=new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Tokyo"});
  try{ if(localStorage.getItem("evDay")===today) return; localStorage.setItem("evDay",today); }catch(e){ return; }
  track("open", LANG);
  const d=DISTRICTS.find(x=>x.id===localStorage.getItem("district"));
  if(d && !firstRun) track("area", d.area);
})();
