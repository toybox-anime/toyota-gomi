<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f9e6e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ごみガイド">
<title>ごみ収集日ガイド</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --text:#1b2230; --sub:#6b7280;
    --line:#e7eaee; --brand:#2f9e6e; --brand-d:#237a55;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1219; --card:#1a1e27; --text:#e8eaf0; --sub:#9aa1b0; --line:#2a2f3a;
           --shadow:0 1px 3px rgba(0,0,0,.3); }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;line-height:1.5}

  /* ===== ブランドヘッダ ===== */
  .topbar{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;
    padding:calc(env(safe-area-inset-top) + 16px) 16px 18px}
  .topbar .inner{max-width:600px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{font-size:26px}
  .brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.01em}
  .brand .city{font-size:12px;opacity:.9;margin-top:1px}
  .langs{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
  .langs button{border:none;background:rgba(255,255,255,.16);color:#fff;
    padding:7px 12px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600;
    transition:background .15s}
  .langs button.on{background:#fff;color:var(--brand-d)}

  .wrap{max-width:600px;margin:0 auto;padding:16px 16px 56px}

  input#search{width:100%;padding:13px 14px;font-size:16px;border:1px solid var(--line);
    border-radius:12px;background:var(--card);color:var(--text);margin:4px 0 8px;box-shadow:var(--shadow)}
  select{width:100%;padding:14px;font-size:16px;border:1px solid var(--line);
    border-radius:12px;background:var(--card);color:var(--text);margin:0 0 6px;appearance:none;box-shadow:var(--shadow)}
  #count{font-size:12px;color:var(--sub);margin:0 2px 16px;text-align:right}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .today{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;border:none}
  .today .lbl{font-size:12px;opacity:.85;letter-spacing:.06em;font-weight:600}
  .today .pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);
    padding:9px 13px;border-radius:999px;font-size:15px;font-weight:700;margin:8px 6px 0 0}
  .today .none{font-size:15px;opacity:.92;margin-top:8px}
  .today .tomo{margin-top:14px;font-size:14px;opacity:.95;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}

  h2{font-size:13px;color:var(--sub);margin:2px 0 12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .cat{display:flex;align-items:center;gap:11px;font-weight:600;font-size:15px}
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .when{color:var(--sub);font-size:13px;text-align:right}
  .next{font-size:12px;color:var(--brand);font-weight:700;margin-top:2px}

  details{border-bottom:1px solid var(--line)}
  details:last-child{border:none}
  summary{padding:12px 0;font-weight:600;font-size:15px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"＋";margin-left:auto;color:var(--sub);font-size:14px}
  details[open] summary::after{content:"−"}
  .items{padding:0 0 12px 32px;color:var(--sub);font-size:14px;line-height:1.9}

  .calbtn{width:100%;margin-top:14px;padding:13px;border:none;border-radius:12px;
    background:var(--brand);color:#fff;font-size:15px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,opacity .2s}
  .calbtn:active{transform:scale(.98)}
  .calbtn.done{background:var(--sub)}
  #dictSearch{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);
    border-radius:12px;background:var(--bg);color:var(--text)}
  .drow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .drow:last-child{border:none}
  .dname{font-weight:600;font-size:14.5px}
  .dnote{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.5}
  .chip{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;
    color:#fff;padding:6px 11px;border-radius:999px;white-space:nowrap}
  /* タブ */
  .tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:4px;margin:4px 0 14px;box-shadow:var(--shadow)}
  .tabs button{flex:1;border:none;background:transparent;color:var(--sub);font-size:15px;font-weight:700;
    padding:10px;border-radius:9px;cursor:pointer}
  .tabs button.on{background:var(--brand);color:#fff}
  /* 要点ルール */
  .keyrule{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-left:4px solid var(--brand);border-radius:12px;padding:13px 15px;margin-bottom:14px;
    font-size:14px;line-height:1.7;box-shadow:var(--shadow)}
  .keyrule .i{font-size:20px;flex:none;line-height:1.3}
  /* ガイドカード */
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;
    margin-bottom:12px;box-shadow:var(--shadow)}
  .gcard .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .gcard .nm{font-weight:800;font-size:16px;display:flex;align-items:center;gap:9px}
  .gcard .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .place{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
    color:#fff;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .gcard .desc{font-size:13.5px;color:var(--sub);margin:9px 0 11px;line-height:1.65}
  .gcard .lbl{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--sub);text-transform:uppercase;margin:0 0 5px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
  .chips span{font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
  .grules{list-style:none;padding:0;margin:0}
  .grules li{font-size:13px;color:var(--text);padding:4px 0 4px 20px;position:relative;line-height:1.55}
  .grules li::before{content:"✓";position:absolute;left:0;color:var(--brand);font-weight:800}
  .placenote{font-size:11.5px;color:var(--sub);margin-top:8px}
  .rule{font-size:14px;line-height:1.8}.rule b{color:var(--text)}
  .note{font-size:12px;color:var(--sub);line-height:1.7;margin-top:10px}
  footer{text-align:center;color:var(--sub);font-size:11px;margin-top:22px;line-height:1.8}
  a{color:var(--brand)}
</style>
</head>
<body>
  <div class="topbar"><div class="inner">
    <div class="brand">
      <span class="logo" id="logo">🗑️</span>
      <div>
        <h1 id="appName">ごみ収集日ガイド</h1>
        <div class="city" id="cityName"></div>
      </div>
    </div>
    <div class="langs" id="langs"></div>
  </div></div>

  <div class="wrap">
    <div class="tabs" id="tabs">
      <button data-v="schedule" class="on" id="tabS"></button>
      <button data-v="guide" id="tabG"></button>
    </div>

    <div id="viewSchedule">
      <input id="search" type="search" autocomplete="off">
      <select id="district"></select>
      <div id="count"></div>
      <div class="card today" id="todayCard"></div>
      <div class="card"><h2 id="hSchedule"></h2><div id="schedule"></div>
        <button id="calBtn" class="calbtn"></button></div>
      <div class="card"><h2 id="hRules"></h2><div class="rule" id="rules"></div></div>
      <footer id="footer"></footer>
    </div>

    <div id="viewGuide" hidden>
      <div class="card" id="photoCard">
        <h2 id="hPhoto"></h2>
        <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
        <button class="calbtn" id="photoBtn"></button>
        <div id="photoStatus" class="placenote" style="margin-top:8px"></div>
        <div id="photoResult"></div>
        <div class="placenote" id="photoDisclaim" style="margin-top:8px"></div>
      </div>
      <div class="keyrule" id="keyRule"></div>
      <div id="guideCards"></div>
      <div class="card">
        <h2 id="hDict"></h2>
        <input id="dictSearch" type="search" autocomplete="off" style="margin-bottom:4px">
        <div id="dictResults"></div>
        <a id="dictLink" href="#" target="_blank" rel="noopener" style="font-size:12px;display:inline-block;margin-top:8px"></a>
      </div>
    </div>
  </div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="dict.js"></script>
<script src="guide.js"></script>
<script src="photo.js"></script>
<script>
const $ = s => document.querySelector(s);
let LANG = localStorage.getItem("lang") || CONFIG.defaultLang;
const T = () => I18N[LANG];
const fmt = (s, ...a) => { let i=0; return s.replace(/%[ds]/g, ()=>a[i++]); };

// ブランド適用
document.documentElement.style.setProperty("--brand", CONFIG.brandColor);
document.documentElement.style.setProperty("--brand-d", CONFIG.brandColorDark);
$("#logo").textContent = CONFIG.logo;
$("#cityName").textContent = CONFIG.cityName;

// 言語ボタン
const langbar = $("#langs");
CONFIG.languages.forEach(l=>{
  const b=document.createElement("button");
  b.textContent=I18N[l].label; b.dataset.l=l;
  b.onclick=()=>{ LANG=l; localStorage.setItem("lang",l); applyLang(); render(); };
  langbar.appendChild(b);
});

const WD = () => T().wd;
const nthWeek = d => Math.floor((d.getDate()-1)/7)+1;
function collectsOn(s,d){ if(!s)return false; const w=d.getDay();
  if(s.weekly) return s.weekly.includes(w);
  if(s.monthly) return s.monthly.day===w && s.monthly.week===nthWeek(d);
  return false; }
function nextDate(s,from){ const d=new Date(from); d.setHours(0,0,0,0);
  for(let i=0;i<62;i++){ if(collectsOn(s,d)) return {date:new Date(d),days:i}; d.setDate(d.getDate()+1);} return null; }
function fmtWhen(s){
  if(s.weekly) return T().weekly.replace("{d}", s.weekly.map(w=>WD()[w]).join("・"));
  if(s.monthly) return T().monthly.replace("{w}", s.monthly.week).replace("{d}", WD()[s.monthly.day]);
  return ""; }

const sel = $("#district"), search = $("#search");
function buildOptions(q){
  q=(q||"").trim(); sel.innerHTML="";
  const areas=[...new Set(DISTRICTS.map(d=>d.area))];
  let shown=0, first=null;
  areas.forEach(area=>{
    const list=DISTRICTS.filter(d=>d.area===area && (!q||d.name.includes(q)||area.includes(q)));
    if(!list.length) return;
    const g=document.createElement("optgroup"); g.label=area;
    list.forEach(d=>{ const o=document.createElement("option"); o.value=d.id; o.textContent=d.name;
      g.appendChild(o); shown++; if(!first)first=d.id; });
    sel.appendChild(g);
  });
  $("#count").textContent = q ? fmt(T().hit, shown) : fmt(T().all, DISTRICTS.length);
  return first;
}

function applyLang(){
  document.documentElement.lang = LANG==="pt"?"pt":(LANG==="en"?"en":"ja");
  $("#appName").textContent = T().appName;
  $("#search").placeholder = T().search;
  $("#hSchedule").textContent = T().schedule;
  $("#hRules").textContent = T().rules;
  $("#tabS").textContent = T().tabS;
  $("#tabG").textContent = T().tabG;
  $("#hPhoto").textContent = T().phTitle;
  $("#photoBtn").textContent = T().phBtn;
  $("#photoDisclaim").textContent = T().phDisclaim;
  $("#hDict").textContent = T().dictQ;
  $("#dictSearch").placeholder = T().dictPh;
  const dl=$("#dictLink"); dl.textContent = T().dictOfficial + " ↗"; dl.href = CONFIG.dictUrl;
  renderDict($("#dictSearch").value);
  renderGuide();
  [...langbar.children].forEach(b=>b.classList.toggle("on", b.dataset.l===LANG));
  buildOptions(search.value);
  const saved=localStorage.getItem("district");
  if(saved && DISTRICTS.some(d=>d.id===saved)) sel.value=saved;
}

function render(){
  const d = DISTRICTS.find(x=>x.id===sel.value) || DISTRICTS[0];
  if(!d) return;
  localStorage.setItem("district", d.id);
  const today=new Date(); today.setHours(0,0,0,0);
  const tomo=new Date(today); tomo.setDate(tomo.getDate()+1);
  const cats=Object.keys(CATEGORIES);
  const cn = k => T().cats[k];

  const todays=cats.filter(k=>collectsOn(d.schedule[k],today));
  const tomos =cats.filter(k=>collectsOn(d.schedule[k],tomo));
  let h=`<div class="lbl">${T().today.toUpperCase()} ${today.getMonth()+1}/${today.getDate()}（${WD()[today.getDay()]}）</div>`;
  h+= todays.length
    ? todays.map(k=>`<span class="pill">${CATEGORIES[k].icon} ${cn(k)}</span>`).join("")
    : `<div class="none">${T().none}</div>`;
  if(tomos.length) h+=`<div class="tomo">${T().tomorrow}：`+tomos.map(k=>cn(k)).join("、")+`</div>`;
  $("#todayCard").innerHTML=h;

  $("#schedule").innerHTML = cats.map(k=>{
    const s=d.schedule[k]; if(!s) return ""; const c=CATEGORIES[k];
    const nx=nextDate(s,today);
    const nxt = nx ? (nx.days===0?T().today:nx.days===1?T().tomorrow:
      `${T().next} ${nx.date.getMonth()+1}/${nx.date.getDate()}（${WD()[nx.date.getDay()]}）`) : "";
    return `<div class="row">
      <div class="cat"><span class="dot" style="background:${c.color}"></span>${c.icon} ${cn(k)}</div>
      <div><div class="when">${fmtWhen(s)}</div><div class="next">${nxt}</div></div></div>`;
  }).join("");

  $("#rules").innerHTML =
    `<b>${T().ruleTime}：</b>${T().timeTxt}<br><b>${T().rulePlace}：</b>${T().placeTxt}`+
    `<div class="note">📍 ${d.area}</div>`;

  $("#footer").innerHTML =
    `${CONFIG.cityShort}公式データ（${CONFIG.dataUpdated}・全${DISTRICTS.length}自治区）`+
    `<br><a href="${CONFIG.officialUrl}" target="_blank" rel="noopener">${CONFIG.cityShort} 公式ごみ情報</a>`;

  // カレンダー通知ボタン
  const btn = $("#calBtn");
  btn.className = "calbtn";
  btn.textContent = T().cal;
  btn.onclick = () => { downloadICS(d); btn.className = "calbtn done"; btn.textContent = "✓ " + T().calDone; };
}

// ===== カレンダー(.ics)生成：繰り返し予定＋前日20時アラーム =====
const BYDAY = ["SU","MO","TU","WE","TH","FR","SA"];
const pad = n => String(n).padStart(2, "0");
const dstamp = dt => `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}`;
function nextOf(s, from){ const d=new Date(from); d.setHours(0,0,0,0);
  for(let i=0;i<62;i++){ if(collectsOn(s,d)) return new Date(d); d.setDate(d.getDate()+1);} return null; }

function buildICS(d){
  const today = new Date(); today.setHours(0,0,0,0);
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//gomi-guide//JP","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  Object.keys(CATEGORIES).forEach(k=>{
    const s = d.schedule[k]; if(!s) return;
    const start = nextOf(s, today); if(!start) return;
    let rrule;
    if(s.weekly) rrule = `FREQ=WEEKLY;BYDAY=${s.weekly.map(w=>BYDAY[w]).join(",")}`;
    else rrule = `FREQ=MONTHLY;BYDAY=${s.monthly.week}${BYDAY[s.monthly.day]}`;
    const dt = `${dstamp(start)}T070000`;          // 収集日 07:00（フローティング＝端末ローカル時刻）
    const name = CATEGORIES[k].icon + I18N[LANG].cats[k];
    L.push(
      "BEGIN:VEVENT",
      `UID:gomi-${d.id}-${k}@${location.host}`,
      `SUMMARY:${name}`,
      `DTSTART:${dt}`,
      `DTEND:${dstamp(start)}T073000`,
      `RRULE:${rrule}`,
      `DESCRIPTION:${I18N[LANG].timeTxt}（${d.area} ${d.name}）`,
      "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${name}`,"TRIGGER:-PT11H",  // 07:00-11h=前日20:00
      "END:VALARM","END:VEVENT"
    );
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
// ===== 分別辞典 検索 =====
function dictCatInfo(cat){
  if(CATEGORIES[cat]) return { icon:CATEGORIES[cat].icon, color:CATEGORIES[cat].color, label:T().cats[cat] };
  const e=DICT_EXTRA[cat]; const lk=(LANG==="en"||LANG==="pt")?LANG:"ja";
  return { icon:e.icon, color:e.color, label:e[lk] };
}
// カタカナ→ひらがな・小文字化・記号除去で表記ゆれに強くする
function fold(s){
  return (s||"").toLowerCase().replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60))
    .replace(/[\s・･、,\.]/g,"");
}
function renderDict(q){
  const box=$("#dictResults"); q=(q||"").trim();
  if(!q){ box.innerHTML=""; return; }
  const fq=fold(q);
  const lk=(LANG==="en"||LANG==="pt")?LANG:"ja";
  const hits=DICT.filter(it=>{
    const fields=[it.ja,it.yomi,it.en,it.pt, ...(typeof SYNONYMS!=="undefined"&&SYNONYMS[it.ja]||[])];
    return fields.some(f=>f && fold(f).includes(fq));
  }).slice(0,25);
  if(!hits.length){ box.innerHTML=`<div class="dnote" style="padding:10px 0">${T().dictNone}</div>`; return; }
  box.innerHTML = hits.map(it=>{
    const c=dictCatInfo(it.cat);
    const name = it[LANG] || it.ja;
    const note = it.note ? (it.note[lk]||it.note.ja)
      : (DICT_EXTRA[it.cat] ? (DICT_EXTRA[it.cat].note[lk]||DICT_EXTRA[it.cat].note.ja) : "");
    return `<div class="drow">
      <div><div class="dname">${name}</div>${note?`<div class="dnote">${note}</div>`:""}</div>
      <span class="chip" style="background:${c.color}">${c.icon} ${c.label}</span>
    </div>`;
  }).join("");
}
$("#dictSearch").addEventListener("input", e=>renderDict(e.target.value));

// ===== 分別ガイド（出す場所の軸で見える化）=====
function renderGuide(){
  const lk=["en","pt","easy"].includes(LANG)?LANG:"ja";
  $("#keyRule").innerHTML=`<span class="i">💡</span><div>${KEY_RULE[lk]||KEY_RULE.ja}</div>`;
  $("#guideCards").innerHTML=GUIDE.map(g=>{
    const isCat=!!CATEGORIES[g.cat];
    const name=isCat?T().cats[g.cat]:(g.name[lk]||g.name.ja);
    const color=isCat?CATEGORIES[g.cat].color:g.color;
    const icon=isCat?CATEGORIES[g.cat].icon:g.icon;
    const pl=PLACES[g.place];
    const desc=(g.desc&&(g.desc[lk]||g.desc.ja))||"";
    const itemsArr=(g.items&&(g.items[lk]||g.items.ja))||[];
    const rulesArr=(g.rules&&(g.rules[lk]||g.rules.ja))||[];
    const items=itemsArr.map(x=>`<span>${x}</span>`).join("");
    const rules=rulesArr.map(r=>`<li>${r}</li>`).join("");
    return `<div class="gcard">
      <div class="top"><span class="nm"><span class="dot" style="background:${color}"></span>${icon} ${name}</span>
        <span class="place" style="background:${pl.color}">${pl.icon} ${pl.label[lk]||pl.label.ja}</span></div>
      <div class="desc">${desc}</div>
      <div class="lbl">${T().gItems}</div><div class="chips">${items}</div>
      <div class="lbl">${T().gRules}</div><ul class="grules">${rules}</ul>
      <div class="placenote">${pl.icon} ${pl.note[lk]||pl.note.ja}</div>
    </div>`;
  }).join("");
}

// タブ切替
const tabbar=$("#tabs");
tabbar.querySelectorAll("button").forEach(b=>b.onclick=()=>{
  tabbar.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  const v=b.dataset.v;
  $("#viewSchedule").hidden=(v!=="schedule");
  $("#viewGuide").hidden=(v!=="guide");
  localStorage.setItem("tab",v);
  window.scrollTo(0,0);
});
(function restoreTab(){
  const v=localStorage.getItem("tab")||"schedule";
  const b=tabbar.querySelector(`button[data-v="${v}"]`); if(b) b.click();
})();

// ===== 写真判定（オンデバイスAI: TensorFlow.js + MobileNet。API不要）=====
let _mnModel=null, _mnLoading=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load "+src));document.head.appendChild(s);});}
async function ensureModel(){
  if(_mnModel) return _mnModel;
  if(!_mnLoading){ _mnLoading=(async()=>{
    $("#photoStatus").textContent=T().phLoading;
    if(!window.tf) await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js");
    if(!window.mobilenet) await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js");
    _mnModel=await mobilenet.load({version:2,alpha:1.0});
    return _mnModel;
  })(); }
  return _mnLoading;
}
function lkey(){ return ["en","pt","easy"].includes(LANG)?LANG:"ja"; }
function resolvePhoto(label){
  const lk=lkey();
  for(const m of PHOTO_MAP){
    if(m.kw.some(k=>label.includes(k))){
      if(m.item){ const it=DICT.find(d=>d.ja===m.item); if(it){ const info=dictCatInfo(it.cat);
        const note=it.note?(it.note[lk]||it.note.ja):(DICT_EXTRA[it.cat]?(DICT_EXTRA[it.cat].note[lk]||DICT_EXTRA[it.cat].note.ja):"");
        return {info, name:(it[LANG]||it.ja), note}; } }
      if(m.cat){ const info=dictCatInfo(m.cat); return {info, name:(m.label?(m.label[lk]||m.label.ja):info.label), note:""}; }
    }
  }
  return null;
}
$("#photoBtn").onclick=()=>$("#photoInput").click();
$("#photoInput").addEventListener("change", async e=>{
  const file=e.target.files[0]; if(!file) return;
  const url=URL.createObjectURL(file);
  $("#photoResult").innerHTML=`<img src="${url}" alt="" style="max-width:100%;max-height:220px;border-radius:12px;margin-top:10px;display:block">`;
  try{
    const model=await ensureModel();
    $("#photoStatus").textContent=T().phAnalyzing;
    const img=new Image(); img.src=url; await img.decode();
    const preds=await model.classify(img,5);
    $("#photoStatus").textContent="";
    let hit=null, used=null;
    for(const p of preds){ const r=resolvePhoto(p.className.toLowerCase()); if(r){ hit=r; used=p; break; } }
    const alt=preds.slice(0,3).map(p=>`${p.className.split(",")[0]} ${Math.round(p.probability*100)}%`).join(" ・ ");
    if(hit){
      $("#photoResult").insertAdjacentHTML("beforeend",`
       <div class="drow" style="margin-top:12px">
        <div><div class="dname">${hit.name}</div>${hit.note?`<div class="dnote">${hit.note}</div>`:""}
          <div class="dnote">${T().phConf} ${Math.round(used.probability*100)}%</div></div>
        <span class="chip" style="background:${hit.info.color}">${hit.info.icon} ${hit.info.label}</span></div>
       <div class="placenote" style="margin-top:6px">AI: ${alt}</div>`);
    } else {
      $("#photoResult").insertAdjacentHTML("beforeend",
        `<div class="dnote" style="margin-top:12px">${T().phNoMatch}</div><div class="placenote" style="margin-top:6px">AI: ${alt}</div>`);
    }
  }catch(err){
    $("#photoStatus").textContent="";
    $("#photoResult").insertAdjacentHTML("beforeend",`<div class="dnote" style="margin-top:12px">${T().phNoMatch}</div>`);
  } finally { setTimeout(()=>URL.revokeObjectURL(url),4000); }
});

function downloadICS(d){
  const blob = new Blob([buildICS(d)], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `gomi-${d.name}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

search.addEventListener("input", ()=>{ const f=buildOptions(search.value); if(f){sel.value=f; render();} });
sel.addEventListener("change", render);

applyLang();
if(!sel.value && DISTRICTS[0]) sel.value=DISTRICTS[0].id;
render();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
